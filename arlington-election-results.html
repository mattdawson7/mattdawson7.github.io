<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Arlington Election Results Map — Desktop</title>
<style>
  :root{
    --bg:#eef0f3; --card:#ffffff; --card2:#f7f8fa; --ink:#17222e; --ink2:#43536a; --ink3:#6b7a8d;
    --line:#d7dde5; --line2:#c3ccd7;
    --navy:#1d3a5f;
    --btn-bg:#ffffff; --btn-line:#c9d2dd; --btn-ink:#22344c;
    --shadow:0 1px 3px rgba(23,34,46,.08),0 6px 18px rgba(23,34,46,.05);
    --radius:10px;
    --map-bg:#e9eee6; --street:#ffffff; --street-casing:#ccd3c9; --water:#b8d4e8;
    --road-label:#5a6a7d; --precinct-stroke:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --card:#1c232e; --card2:#232c39; --ink:#e8edf3; --ink2:#b6c2d1; --ink3:#8b9aaf;
      --line:#333f4f; --line2:#43536a;
      --navy:#8fb4dd;
      --btn-bg:#232c39; --btn-line:#43536a; --btn-ink:#dbe5f0;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
      --map-bg:#1e2a24; --street:#33413a; --street-casing:#232c39; --water:#274b66;
      --road-label:#9db1a5; --precinct-stroke:#12161c;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}

  /* ---------- compact header: one small line ---------- */
  header.top{
    background:var(--card); border-bottom:2px solid var(--navy);
    padding:5px 20px 4px; flex:none;
  }
  .top-inner{max-width:1720px;margin:0 auto; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 10px}
  h1{font-size:15.5px; font-weight:800; margin:0; letter-spacing:-.01em; line-height:1.15; white-space:nowrap}
  .top-stats{color:var(--ink2); font-size:12px; margin:0; font-weight:500; white-space:nowrap}

  /* ---------- desktop layout: one screen, no page scroll ---------- */
  .layout{
    max-width:1720px; margin:0 auto; padding:8px 16px 6px; width:100%;
    display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; align-items:stretch;
  }
  @media (min-width:901px){
    body{display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden}
    .layout{flex:1 1 auto; min-height:0}
  }

  /* ---------- self-contained SVG map ---------- */
  .map-col{min-width:0; display:flex; flex-direction:column; min-height:0}
  .map-wrap{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:6px; flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  }
  #map{border-radius:6px; overflow:hidden; background:var(--map-bg); flex:1 1 auto; min-height:0; display:flex}
  #map svg{display:block; width:100%; height:100%}
  .street-line{fill:none; stroke:var(--street); stroke-linecap:round; stroke-linejoin:round}
  .street-casing{fill:none; stroke:var(--street-casing); stroke-linecap:round; stroke-linejoin:round}
  .water-body{fill:var(--water); stroke:none}
  .precinct-path{stroke:var(--precinct-stroke); stroke-width:1.6; stroke-linejoin:round; cursor:pointer; fill-opacity:.62}
  .precinct-path:hover, .precinct-path:focus{stroke:#17222e; stroke-width:2.6; outline:none}
  .precinct-path.selected-precinct{stroke:#17222e; stroke-width:2.8}
  @media (prefers-color-scheme: dark){
    .precinct-path:hover, .precinct-path:focus, .precinct-path.selected-precinct{stroke:#e8edf3}
  }
  .precinct-label{
    font-weight:700; font-size:17px; fill:#17222e; text-anchor:middle; dominant-baseline:central;
    paint-order:stroke; stroke:#ffffff; stroke-width:3.5px; stroke-linejoin:round; pointer-events:none;
  }
  @media (prefers-color-scheme: dark){
    .precinct-label{fill:#e8edf3; stroke:#12161c}
  }
  .road-label{
    font-size:11.5px; font-weight:600; fill:var(--road-label); text-anchor:middle;
    paint-order:stroke; stroke:var(--map-bg); stroke-width:3px; stroke-linejoin:round; pointer-events:none;
    letter-spacing:.01em;
  }
  .water-label{font-size:11px; font-style:italic; fill:#3d6a8a; text-anchor:middle; pointer-events:none}
  @media (prefers-color-scheme: dark){ .water-label{fill:#8fc0dd} }
  .map-hint{font-size:12px; color:var(--ink3); padding:5px 4px 1px; margin:0; flex:none}

  .precinct-info{
    display:none; margin-top:6px; border:1px solid var(--line); border-radius:8px;
    background:var(--card2); padding:10px 13px; font-size:13.5px; line-height:1.45; flex:none;
  }
  .precinct-info.open{display:block}
  .precinct-info h3{margin:0 0 1px; font-size:15px}
  .precinct-info .pop-sub{color:var(--ink2); font-size:12.5px; margin-bottom:5px}
  .precinct-info .pop-line{padding:1.5px 0}
  .precinct-info .pop-line.dim{color:var(--ink2)}
  .precinct-info .cdot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; border:1px solid rgba(0,0,0,.2)}
  .precinct-info .info-close{
    float:right; border:1px solid var(--line2); background:var(--btn-bg); color:var(--btn-ink);
    border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600;
  }

  .legend{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:8px 14px 9px; margin-top:10px; flex:none;
  }
  .legend-what{font-size:14px; font-weight:700; margin:0 0 6px}
  .legend-gradient{height:11px; border-radius:4px; border:1px solid var(--line2)}
  .legend-scale{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink2); margin-top:3px}
  .legend-scale .mid{font-weight:700; color:var(--ink); text-align:center}
  .legend-scale .end{text-align:right}
  .legend-note{font-size:12px; color:var(--ink3); margin-top:4px}

  /* ---------- button panel ---------- */
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:12px 14px 10px; min-height:0;
  }
  @media (min-width:901px){
    .panel{overflow-y:auto}
  }
  .panel h2{font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink2); margin:0 0 8px; font-weight:700}
  .race-label{font-size:12.5px; font-weight:700; color:var(--ink2); margin:12px 0 5px}
  .race-label:first-of-type{margin-top:0}
  .btn-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:2px}
  .opt-btn{
    border:1.5px solid var(--btn-line); background:var(--btn-bg); color:var(--btn-ink);
    border-radius:999px; padding:6px 13px; font-size:14px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px; line-height:1.25; text-align:left;
    min-height:36px;
  }
  .opt-btn:hover{border-color:var(--ink3)}
  .opt-btn .dot{width:11px; height:11px; border-radius:3px; flex:none; border:1px solid rgba(0,0,0,.18)}
  .opt-btn.selected{
    background:var(--navy); border-color:var(--navy); color:#fff;
    box-shadow:0 2px 8px rgba(29,58,95,.35);
  }
  @media (prefers-color-scheme: dark){
    .opt-btn.selected{background:#2c5282; border-color:#2c5282; color:#fff}
  }
  .q-grid{display:flex; flex-wrap:wrap; gap:6px}
  .q-grid .opt-btn{border-radius:9px; padding:7px 11px; font-size:13.5px}
  .q-grid .q-grad{width:24px; height:12px; border-radius:3px; flex:none; border:1px solid rgba(0,0,0,.22)}
  .opt-btn.selected .q-grad{border-color:rgba(255,255,255,.5)}

  footer{
    max-width:1720px; margin:0 auto; padding:4px 20px 8px; width:100%;
    color:var(--ink3); font-size:12px; flex:none;
  }

  /* ---------- narrower screens: stack and scroll normally ---------- */
  @media (max-width:900px){
    .layout{grid-template-columns:minmax(0,1fr); padding:8px 12px 4px}
    #map{flex:none; display:block}
    #map svg{height:auto}
    .map-wrap{flex:none}
    h1{white-space:normal}
    .top-stats{white-space:normal}
    footer{padding-bottom:14px}
  }
</style>
</head>

</div>

  function scan(coords){
    if (typeof coords[0] === "number"){
      if (coords[0] < minLon) minLon = coords[0];
      if (coords[0] > maxLon) maxLon = coords[0];
      if (coords[1] < minLat) minLat = coords[1];
      if (coords[1] > maxLat) maxLat = coords[1];
    } else { coords.forEach(scan); }
  }
  GEO.features.forEach(function(f){ scan(f.geometry.coordinates); });
  var padLon = (maxLon - minLon) * 0.02, padLat = (maxLat - minLat) * 0.03;
  minLon -= padLon; maxLon += padLon; minLat -= padLat; maxLat += padLat;
  var cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
  var W = 1000;
  var H = Math.round(W * (maxLat - minLat) / ((maxLon - minLon) * cosLat));
  function X(lon){ return (lon - minLon) * cosLat / ((maxLon - minLon) * cosLat) * W; }
  function Y(lat){ return (maxLat - lat) / (maxLat - minLat) * H; }
  function ringPath(ring){
    var d = "";
    ring.forEach(function(pt, i){ d += (i === 0 ? "M" : "L") + X(pt[0]).toFixed(1) + "," + Y(pt[1]).toFixed(1); });
    return d + "Z";
  }
  function geomPath(geom){
    var polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
    var d = "";
    polys.forEach(function(poly){ poly.forEach(function(ring){ d += ringPath(ring); }); });
    return d;
  }
  function centroid(geom){
    var polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
    var ring = polys[0][0], sx = 0, sy = 0;
    ring.forEach(function(pt){ sx += X(pt[0]); sy += Y(pt[1]); });
    return [sx / ring.length, sy / ring.length];
  }
  function linePoints(pts){
    return pts.map(function(pt){ return X(pt[0]).toFixed(1) + "," + Y(pt[1]).toFixed(1); }).join(" ");
  }

  var svg = el("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "xMidYMid meet", role: "img", "aria-label": "Arlington precincts map" });
  svg.appendChild(el("rect", { x: 0, y: 0, width: W, height: H, fill: "var(--map-bg)" }));

  /* Spy Pond under the fills */
  var pond = el("polygon", { points: linePoints(SPY_POND), "class": "water-body" });
  svg.appendChild(pond);

  /* streets: casing then surface */
  STREETS.forEach(function(s){
    svg.appendChild(el("polyline", { points: linePoints(s.pts), "class": "street-casing", "stroke-width": 7 }));
  });
  STREETS.forEach(function(s){
    svg.appendChild(el("polyline", { points: linePoints(s.pts), "class": "street-line", "stroke-width": 4.5 }));
  });

  /* precinct fills */
  precinctPaths = [];
  var labelData = [];
  GEO.features.forEach(function(f){
    var pNum = parseInt(f.properties.PRECINCT, 10);
    var pIdx = pNum - 1;
    var path = el("path", {
      d: geomPath(f.geometry), "class": "precinct-path",
      tabindex: "0", role: "button",
      "aria-label": "Precinct " + pNum + " — tap for its numbers"
    });
    path.dataset.precinct = pIdx;
    path.setAttribute("fill", fillFor(pIdx));
    (function(idx, node){
      node.addEventListener("click", function(){ showPrecinct(idx); });
      node.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); showPrecinct(idx); }
      });
    })(pIdx, path);
    svg.appendChild(path);
    precinctPaths[pIdx] = path;
    labelData.push({ n: pNum, c: centroid(f.geometry) });
  });

  /* road labels over the fills, kept small and plain */
  STREETS.forEach(function(s){
    var t = el("text", {
      x: X(s.label[0]), y: Y(s.label[1]), "class": "road-label",
      transform: "rotate(" + (s.angle || 0) + " " + X(s.label[0]) + " " + Y(s.label[1]) + ")"
    });
    t.textContent = s.name;
    svg.appendChild(t);
  });
  var pondLabel = el("text", { x: X(-71.1645), y: Y(42.4042), "class": "water-label" });
  pondLabel.textContent = "Spy Pond";
  svg.appendChild(pondLabel);

  /* precinct numbers on top */
  labelData.forEach(function(L){
    var t = el("text", { x: L.c[0], y: L.c[1], "class": "precinct-label" });
    t.textContent = String(L.n);
    svg.appendChild(t);
  });

  host.appendChild(svg);
}

function refreshMap(){
  precinctPaths.forEach(function(path, pIdx){
    if (path) path.setAttribute("fill", fillFor(pIdx));
  });
}

function infoHTML(pIdx){
  var r = race();
  var html = '<button class="info-close" id="infoClose" type="button">Close</button>';
  html += "<h3>Precinct " + (pIdx + 1) + "</h3>";
  html += '<div class="pop-sub">' + fmt(RESULTS.turnout[pIdx]) + " ballots cast</div>";
  r.candidates.forEach(function(c, i){
    var v = c.votes[pIdx];
    if (v == null){
      html += '<div class="pop-line dim"><span class="cdot" style="background:' + candColor(state.raceIdx, i) + '"></span>' + esc(c.name) + " — not on the ballot here</div>";
    } else {
      html += '<div class="pop-line"><span class="cdot" style="background:' + candColor(state.raceIdx, i) + '"></span>' + esc(c.name) + " — " + fmt(v) + " votes · " + pct(v / RESULTS.turnout[pIdx]) + "</div>";
    }
  });
  if (isQuestion(r)){
    var y = r.candidates[0].votes[pIdx], n = r.candidates[1].votes[pIdx];
    if (y != null && n != null && (y+n) > 0){
      html += '<div class="pop-line">Yes got <b>' + pct(y / (y+n)) + "</b> of the Yes and No votes</div>";
    }
  }
  return html;
}

function showPrecinct(pIdx){
  selectedPrecinct = pIdx;
  precinctPaths.forEach(function(path, i){
    if (path) path.classList.toggle("selected-precinct", i === pIdx);
  });
  var box = document.getElementById("precinctInfo");
  box.innerHTML = infoHTML(pIdx);
  box.classList.add("open");
  var closeBtn = document.getElementById("infoClose");
  if (closeBtn) closeBtn.addEventListener("click", hidePrecinct);
}
function hidePrecinct(){
  selectedPrecinct = -1;
  precinctPaths.forEach(function(path){ if (path) path.classList.remove("selected-precinct"); });
  var box = document.getElementById("precinctInfo");
  box.classList.remove("open");
  box.innerHTML = "";
}

function select(rIdx, mode, candIdx){
  state.raceIdx = rIdx; state.mode = mode; state.candIdx = candIdx || 0;
  markSelected();
  updateLegend();
  refreshMap();
  if (selectedPrecinct >= 0) showPrecinct(selectedPrecinct);
}

/* ---------- start: everything is already on this page ---------- */
buildButtons();
markSelected();
updateLegend();
buildMap();
})();
</script>
</body>
</html>
